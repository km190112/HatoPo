[package]
name = "hatopo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
hatopo-core = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-winrt-notification = "0.8.1"
tray-icon = { version = "0.24.2", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "HatoPo"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
